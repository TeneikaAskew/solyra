name: Cross-repo contract drift (Rule 6)
description: The API shape this app expects and the one stocks actually serves have diverged
title: "contract: <endpoint or type> — <how it diverged>"
body:
  - type: markdown
    attributes:
      value: |
        `src/types/` and `tests/helpers/fixtures/` are hand-maintained **here**
        while the API that produces those shapes lives in **TeneikaAskew/stocks**.
        The fixtures `satisfies` the types, so a fixture cannot drift from a
        type. Neither one is evidence about the server.

        **So the evidence for this issue has to come from the API, not from this
        repo.** Either a real response, or the vendored OpenAPI snapshot checked
        against stocks `main`. Confirm the stocks router actually returns the
        shape; never reshape a type to make a fixture compile.

        Two directions, and only one is mechanically caught today:

        - **Narrowing is caught where a payload exists.** A field the app
          reads or sends that the API no longer declares fails the contract
          test — but only for operations that have a mock. The twelve in
          `UNMOCKED_REQUESTED` have no payload to validate, so
          `GET /api/options/live/{ticker}/{date_str}` can lose a field while
          `ProfilesTab.tsx`'s locally-declared `OptionsResponse` still reads
          it and everything passes. For those, check the schema by hand.
        - **Widening is not.** A field going from required `string` to nullable
          leaves both the old mock and the old type valid, so the suite passes
          while production returns a null the app does not handle. This caused
          two real UI bugs after #54, found by review rather than by the suite.

        And an operation with no `response_model` in stocks emits an empty
        schema that validates anything, so a renamed field there passes CI in
        both repos and breaks this app at runtime.

        **In step 1 the null goes in a test-only payload, never the canonical
        mock.** The mocks `satisfies` the TS types AND are Ajv-validated against the
        vendored schema, which in step 1 is still the OLD one. So a null in
        `MOCK_MARKET_DATA` fails `tsc -b` before the type is widened and fails
        `src/mocks/contract.test.ts` after — the compatibility step cannot use the
        canonical fixture to prove itself. Use a unit case on the pure helper, or a
        body built inside a `page.route` handler. The canonical mock takes the null in
        step 3, once the synced schema admits it.

        **A widening is nullable OR optional, and they need different payloads.**
        Required to nullable takes `T | null` and a null value. Required to
        optional but still non-nullable takes `field?: T` and an **omitted key** —
        the new schema still REJECTS null there, so a null payload exercises a
        shape the API cannot emit while the missing-key path goes untested, and
        step 3 would then put that null in the canonical mock and fail validation.

        **Step 2 waits for old bundles, not for step 1's deploy.** Deploying the
        compatible frontend changes what a browser fetches NEXT and nothing about a
        tab already open, and this app registers no service worker and no update
        prompt — so a session keeps its bundle until someone reloads. stocks
        emitting the null before then hits exactly the readers the ordering
        protects. A deploy and every client having it are different events.

        **Whichever side RECEIVES must tolerate the new shape first**, and that is
        not always this app. For a response we read, it is us: our reader goes
        first. For a request body we send, it is stocks — it relaxes the field to
        optional and deploys BEFORE we stop sending it, because its request models
        set `extra="forbid"`, so an unknown or missing key is a 422 rather than
        something quietly ignored. And its final removal waits for old browser
        sessions to age out, not for our deploy. "Consumer first" describes a
        response; it is not a rule about which repository moves first.

        **Scope `jq` to the FIELD and pass `-Sc`.** Diffing whole
        pretty-printed schemas gives you multiline blocks and `@@` ranges you
        have to read around; one compact sorted line per side shows the change
        itself.

        **`contract:check` names the operation and never the field.** It prints
        `components.schemas changed` and stops, so the field-level evidence this
        form asks for has to be produced by diffing the two documents yourself.
        The placeholder below shows that recipe against a widening that really
        happened — `LiveQuoteResponse.change_pct` went nullable on 2026-09-07 —
        and it is dated for the same reason everything else here is: re-run it,
        do not paste it.

  - type: input
    id: surface
    attributes:
      label: Endpoint and type
      description: The route, and the type or fixture on this side that describes it.
      placeholder: "GET /api/me/preferences — src/types/preferences.ts:UserPreferences, src/mocks/common.ts"
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: Direction of the drift
      options:
        - Narrowing — the app reads or sends a field the API no longer declares
        - Widening — a field became nullable or optional and the type does not admit it
        - Missing endpoint — the app calls a route that does not exist
        - Untyped operation — no response_model in stocks, so nothing validates
        - Frontend-first — the app documents a contract that was never built
    validations:
      required: true

  - type: textarea
    id: api-evidence
    attributes:
      label: Evidence from the API
      description: A real response, or the vendored snapshot checked against stocks main. Command and output together.
      render: shell
      placeholder: |
        # contract:check names the operation, never the field:
        $ npm run contract:check
        [api-contract] vendored snapshot is STALE against stocks.
          components.schemas changed (a response or request model)

        # Get the field diff yourself (see above on -Sc). Measured 2026-09-07:
        $ F='.components.schemas.LiveQuoteResponse.properties.change_pct'
        $ curl -s https://raw.githubusercontent.com/TeneikaAskew/stocks/main/platform/api/openapi.json \
            | jq -Sc "$F" > /tmp/up.txt
        $ jq -Sc "$F" tests/fixtures/stocks-openapi.json | diff - /tmp/up.txt
        1c1
        < {"title":"Change Pct","type":"number"}
        > {"anyOf":[{"type":"number"},{"type":"null"}],"title":"Change Pct"}

        # For a MISSING route, prove absence against the contract, not a grep
        # of a sibling checkout that may not be present:
        $ jq -r '.paths | keys[] | select(test("journal/stats"))' tests/fixtures/stocks-openapi.json
        (no output — the operation is not declared)
    validations:
      required: true

  - type: textarea
    id: app-evidence
    attributes:
      label: What this app does with it today
      description: >-
        The consuming code and the user-visible result. A bare `·` badge or a
        `—%` on a dashboard tile is the concrete consequence, and it is worth
        more than "type mismatch".
      render: shell
      placeholder: |
        $ grep -rn -A1 "export function topSetupAvgReturn" src/routes/DashboardPage.tsx
        215:export function topSetupAvgReturn(v: number | null | undefined): string {
        216-  if (v == null || Number.isNaN(v)) return '—';
        Guarded here. Name the call site that is NOT — one that formats before it
        null-checks renders `—%` instead of `—` the moment a field widens.
    validations:
      required: true

  - type: textarea
    id: paired-change
    attributes:
      label: The paired change set
      description: "Rule 6: the RECEIVING side tolerates the new shape first. That is this app for a response, stocks for a request body. Say which step this is."
      placeholder: |
        A widening, in order.

        Step 1 HERE — widen `VolumeBar.value` to `number | null` in
        src/hooks/useMarketData.ts, guard every call site tsc flags, and remove the
        AUDIT-marked `?? 0` at src/routes/ChartsPage.tsx:364 — a live Rule 4
        violation the moment step 2 emits null. Null exercised by a TEST-ONLY
        payload (see above). No snapshot change. Merge, deploy.

        Step 2 STOCKS — widen `_Bar.volume` to `float | None` in
        platform/api/routers/live.py, handle a null-volume bar in lib/indicators VWAP,
        regenerate openapi.json, merge, deploy.

        Step 3 HERE, on a NEW branch and PR — the step-1 PR merged two steps ago, so
        a commit to that head lands nowhere. `npm run contract:sync`, then move the
        null INTO the canonical mock and tests/helpers/fixtures/charts.ts now that the
        schema admits it. The type does not move again.

        Producer first breaks this: stocks deploys, the API emits null, and the frontend
        in front of it still assumes non-null. A narrowing flips by direction — see
        above — so say which one you have.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - `npm run contract:check` clean against stocks main.
        - A null-bearing case added FIRST and failing before the type is widened. In
          step 1 that has to be a TEST-ONLY payload; the canonical mocks `satisfies` the
          types and are Ajv-validated against the still-old vendored schema, so a null
          in one fails both `tsc -b` and `src/mocks/contract.test.ts` before the widening
          it is meant to prove. The canonical mock carries the null in step 3.
        - An E2E or unit assertion that the surface renders `—` rather than `—%`.
        - Both PR descriptions name the other side's PR number.

        Do NOT write "tsc -b fails once the snapshot is regenerated". It will not:
        TypeScript never imports tests/fixtures/stocks-openapi.json, which is read at
        runtime by src/mocks/contract.test.ts, and under a widened schema the old
        fixture stays valid — that blind spot is the whole reason this form exists.
        Only a null-bearing fixture, or a schema-to-type check, can fail on widening.
    validations:
      required: true

  - type: checkboxes
    id: attestation
    attributes:
      label: Evidence attestation
      description: >-
        The evidence has to come from the API. `src/types/`, a fixture, a mock
        and a hook's doc comment are all this side of the wire.
      options:
        - label: >-
            The API-side evidence came from a real response, or from the
            snapshot checked against stocks `main`, while filing this issue.
          required: true
        - label: >-
            I confirmed what the stocks router returns, or that no such router
            exists, rather than assuming the type here was right.
          required: true
